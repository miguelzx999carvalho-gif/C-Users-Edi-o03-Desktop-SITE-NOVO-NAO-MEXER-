<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início | Trabalhos SENAC — Miguel Carvalho</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <nav class="menu">
            <a href="index.html" class="link-ativo">🏠 Início</a>
            <a href="projetos.html">📂 Projetos</a>
            <a href="avisos.html">📢 Avisos</a>
            <a href="sobre.html">👤 Sobre</a>
            <a href="#" onclick="abrirLogin(); return false;" class="botao-adm">🔐 Admin</a>
        </nav>
    </header>

    <main>
        <section class="boas-vindas">
            <h1>🎓 Trabalhos SENAC</h1>
            <p class="subtitulo">Portfólio e apresentação de projetos — Miguel Carvalho</p>
            <div class="destaques">
                <div class="card-destaque">
                    <span class="numero" id="qtd-projetos">0</span>
                    <span class="rotulo">Projetos</span>
                </div>
                <div class="card-destaque">
                    <span class="numero" id="qtd-avisos">0</span>
                    <span class="rotulo">Avisos</span>
                </div>
                <div class="card-destaque">
                    <span class="numero" id="qtd-comentarios">0</span>
                    <span class="rotulo">Comentários</span>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>📢 Últimos Avisos</h2>
            <div id="lista-avisos"></div>
            <a href="avisos.html" class="botao">Ver todos os avisos →</a>
        </section>

        <section class="card">
            <h2>📂 Últimos Projetos</h2>
            <div id="lista-projetos"></div>
            <a href="projetos.html" class="botao">Ver todos os projetos →</a>
        </section>
    </main>

    <div id="loginTela" class="tela-login">
        <div class="caixa-login">
            <button class="fechar" onclick="fecharLogin()">&times;</button>
            <h3>🔐 Acesso Administrativo</h3>
            <input type="email" id="email" placeholder="📧 Seu e-mail">
            <input type="password" id="senha" placeholder="🔑 Senha">
            <button onclick="entrar()" class="botao-entrar">Entrar</button>
        </div>
    </div>

    <script>
        const EMAIL_DONO = "miguelzx999carvalho@gmail.com";
        const SENHA_DONO = "1029384756SENAC";

        function abrirLogin() { document.getElementById('loginTela').style.display = 'flex'; }
        function fecharLogin() { document.getElementById('loginTela').style.display = 'none'; }
        function entrar() {
            const e = document.getElementById('email').value;
            const s = document.getElementById('senha').value;
            if (e === EMAIL_DONO && s === SENHA_DONO) {
                localStorage.setItem('logado', 'SIM');
                alert('✅ Bem-vindo, Miguel! Painel aberto.');
                fecharLogin();
                window.location.href = 'painel.html';
            } else { alert('❌ E-mail ou senha incorretos!'); }
        }

        function carregarPagina() {
            const projetos = JSON.parse(localStorage.getItem('projetos') || '[]');
            const avisos = JSON.parse(localStorage.getItem('avisos') || '[]');
            const comentarios = JSON.parse(localStorage.getItem('comentarios') || '[]');

            document.getElementById('qtd-projetos').textContent = projetos.length;
            document.getElementById('qtd-avisos').textContent = avisos.length;
            document.getElementById('qtd-comentarios').textContent = comentarios.length;

            const listaAvisos = document.getElementById('lista-avisos');
            listaAvisos.innerHTML = avisos.length === 0
                ? '<p class="vazio">Nenhum aviso publicado ainda.</p>'
                : avisos.slice(-2).reverse().map(a => `
                    <div class="item-card">
                        <h4>📢 ${a.titulo}</h4>
                        <p>${a.texto.length > 100 ? a.texto.substring(0,100)+'...' : a.texto}</p>
                        <small>📅 ${a.data} · <a href="avisos.html#aviso-${a.id}">Ver e comentar 💬</a></small>
                    </div>`).join('');

            const listaProj = document.getElementById('lista-projetos');
            listaProj.innerHTML = projetos.length === 0
                ? '<p class="vazio">Nenhum projeto publicado ainda.</p>'
                : projetos.slice(-3).reverse().map(p => `
                    <div class="item-card">
                        <span class="etiqueta">${p.secao}</span>
                        <h4>${p.titulo}</h4>
                        <p>${p.descricao || 'Sem descrição'}</p>
                        <a href="${p.link}" target="_blank" class="link-externo">🔗 Abrir →</a>
                        <small>💬 ${(comentarios.filter(c=>c.alvoId===p.id && c.tipo==='projeto')).length} comentários</small>
                    </div>`).join('');
        }
        carregarPagina();
    </script>

</body>
</html>
