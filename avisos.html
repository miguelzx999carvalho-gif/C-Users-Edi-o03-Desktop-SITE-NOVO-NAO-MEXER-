    <main class="conteudo">
        <h1>📢 Avisos e Comunicados</h1>

        <!-- ✅ AVISOS FIXOS — NUNCA MAIS SOMEM! -->
        <div class="avisos-lista">

            <!-- 📢 SEU AVISO PRONTO -->
            <div class="aviso-card destaque">
                <span class="aviso-tipo">📢 Comunicado</span>
                <h3>Aviso Importante!</h3>
                <p>Os Canvas e Vídeos de entrevistas que ainda não estão no site, serão colocados amanhã assim que chegarmos!!!</p>
                <div class="data-aviso">📅 26/08/2026</div>

            <!-- 👇 ADICIONE MAIS AVISOS AQUI SEGUINDO O MESMO MODELO:
            <div class="aviso-card">
                <span class="aviso-tipo">ℹ️ Informação</span>

    <!-- TELA DE LOGIN (igual ao dos projetos) -->
    <div id="loginTela" class="tela-login">
        <div class="caixa-login">
            <button class="fechar" onclick="fecharLogin()">&times;</button>
            <h3>🔐 Acesso Administrativo</h3>
            <input type="email" id="email" placeholder="📧 Seu e-mail">
            <input type="password" id="senha" placeholder="🔑 Senha">
            <button onclick="entrar()" class="botao-entrar">Entrar</button>
        </div>
    </div>

    <script>
        // DADOS DE ACESSO — IGUAL AO SEU
        const EMAIL_DONO = "miguelzx999carvalho@gmail.com";
        const SENHA_DONO = "1029384756SENAC";

        function abrirLogin() { document.getElementById('loginTela').style.display = 'flex'; }
        function fecharLogin() { document.getElementById('loginTela').style.display = 'none'; }
        
        function entrar() {
            const e = document.getElementById('email').value;
            const s = document.getElementById('senha').value;
            if (e === EMAIL_DONO && s === SENHA_DONO) {
                localStorage.setItem('logado', 'SIM');
                alert('✅ Bem-vindo, Miguel!');
                fecharLogin();
                window.location.href = 'painel.html';
            } else {
                alert('❌ Dados incorretos!');
            }
        }
    </script>
