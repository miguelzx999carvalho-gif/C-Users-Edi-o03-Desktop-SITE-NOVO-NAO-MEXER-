<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos e Comunicados | SENAC</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <nav class="menu">
            <a href="index.html">🏠 Início</a>
            <a href="projetos.html">📂 Projetos</a>
            <a href="avisos.html" class="link-ativo">📢 Avisos</a>
            <a href="sobre.html">👤 Sobre</a>
            <a href="#" onclick="abrirLogin(); return false;" class="botao-adm">🔐 Admin</a>
        </nav>
    </header>

    <main>
        <h1>📢 Avisos e Comunicados</h1>
        <div id="lista-avisos"></div>
    </main>

    <div id="loginTela" class="tela-login">
        <div class="caixa-login">
            <button class="fechar" onclick="fecharLogin()">&times;</button>
            <h3>🔐 Acesso Administrativo</h3>
            <input type="email" id="email" placeholder="📧 Seu e-mail">
            <input type="password" id="senha" placeholder="🔑 Senha">
            <button onclick="entrar()" class="botao-entrar">Entrar</button>
        </div>
    </div>

    <script>
        const EMAIL_DONO = "miguelzx999carvalho@gmail.com";
        const SENHA_DONO = "1029384756SENAC";

        function abrirLogin() { document.getElementById('loginTela').style.display = 'flex'; }
        function fecharLogin() { document.getElementById('loginTela').style.display = 'none'; }
        function entrar() {
            const e = document.getElementById('email').value;
            const s = document.getElementById('senha').value;
            if (e === EMAIL_DONO && s === SENHA_DONO) {
                localStorage.setItem('logado', 'SIM');
                alert('✅ Bem-vindo!');
                fecharLogin();
                window.location.href = 'painel.html';
            } else { alert('❌ Dados incorretos!'); }
        }

        function carregarAvisos() {
            const avisos = JSON.parse(localStorage.getItem('avisos') || '[]');
            const comentarios = JSON.parse(localStorage.getItem('comentarios') || '[]');
            const lista = document.getElementById('lista-avisos');

            if (avisos.length === 0) {
                lista.innerHTML = '<p class="vazio">Nenhum aviso publicado ainda.</p>';
                return;
            }

            lista.innerHTML = avisos.slice().reverse().map(a => {
                const qtdComent = comentarios.filter(c=>c.alvoId===a.id && c.tipo==='aviso').length;
                return `
                <div class="card-aviso" id="aviso-${a.id}">
                    <h3>📢 ${a.titulo}</h3>
                    <div class="texto-aviso">${a.texto.replace(/\n/g, '<br>')}</div>
                    <small>📅 ${a.data}</small>
                    <div class="area-comentarios">
                        <h4>💬 ${qtdComent} Comentário(s)</h4>
                        <div class="caixa-comentario">
                            <input type="text" id="nomeA-${a.id}" placeholder="Seu nome" class="input-nome">
                            <textarea id="comentA-${a.id}" placeholder="Comente esse aviso..." class="txt-comentario"></textarea>
                            <button onclick="comentarAviso('${a.id}')" class="btn-comentar">Enviar ✅</button>
                        </div>
                        <div class="lista-comentarios">
                            ${comentarios.filter(c=>c.alvoId===a.id && c.tipo==='aviso').map(c=>`
                                <div class="comentario">
                                    <strong>${c.nome}</strong>
                                    <p>${c.texto}</p>
                                    <small>${c.data}</small>
                                </div>`).join('')}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function comentarAviso(id) {
            const nome = document.getElementById(`nomeA-${id}`).value.trim();
            const texto = document.getElementById(`comentA-${id}`).value.trim();
            if (!nome || !texto) { alert('❌ Preencha seu nome e o comentário!'); return; }
            const comentarios = JSON.parse(localStorage.getItem('comentarios') || '[]');
            comentarios.push({
                id: Date.now(),
                alvoId: id,
                tipo: 'aviso',
                nome: nome,
                texto: texto,
                data: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
            });
            localStorage.setItem('comentarios', JSON.stringify(comentarios));
            carregarAvisos();
        }

        carregarAvisos();
    </script>

</body>
</html>
